spring:
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
    livereload:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5433/novalume_customers
    username: postgres
    password: novalumepostgres
  jpa:
    hibernate:
      ddl-auto: create-drop
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/novalumestore
          jwk-set-uri: http://localhost:9090/realms/novalumestore/protocol/openid-connect/certs

keycloak:
  admin:
    realm-name: novalumestore


server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    br.com.eduardo: DEBUG
    org.springframework.web: DEBUG