spring:
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
    livereload:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5433/novalume_customers
    username: postgres
    password: novalumepostgres
  jpa:
    hibernate:
      ddl-auto: update

server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    br.com.eduardo: DEBUG
    org.springframework.web: DEBUG